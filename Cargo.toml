[workspace]
members = ["crates/husk-plugin", "crates/dolphin-herdr", "crates/herdr-sidebar"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "net", "rt", "macros", "sync", "time"] }
